# Welcome to Jekyll!
#
# 这里放影响全站的设置，修改后需要重启 `jekyll serve`（不会自动重载）。

# Site Settings
title                    : "Liang Zhu (朱亮)"
description              : "Personal homepage of Liang Zhu (朱亮), Ph.D. student in the Software Engineering Institute at East China Normal University."
url                      : "https://zhuliangsec.github.io"
repository               : "zhuliangsec/zhuliangsec.github.io"

# Google Scholar 引用数自动更新：
# 下面的 ID 来自 Scholar 主页 URL 中 user= 后面那串，workflow 会直接读取它，
# 也可以在 Settings -> Secrets and variables -> Actions 里用 GOOGLE_SCHOLAR_ID 覆盖。
# 统计结果写入 google-scholar-stats 分支后，页面自动显示总引用数与徽标。
# true 走 jsDelivr CDN（国内可访问，但有缓存延迟），false 走 raw.githubusercontent.com。
google_scholar_id            : "hbWYZ4MAAAAJ"
google_scholar_stats_use_cdn : true

# Google Analytics：填入 ID（如 G-XXXXXXXXXX）后自动启用，留空则不加载任何统计脚本。
google_analytics_id      :

# SEO 验证：从各搜索引擎的站长平台获取后填入。
google_site_verification :
bing_site_verification   :
baidu_site_verification  :

# Site Author（侧栏资料）
# 只列出常用项；对应逻辑在 _includes/author-profile.html，未填写的项不会渲染。
author:
  name             : "Liang Zhu (朱亮)"
  avatar           : "images/zl.jpg"
  bio              : "Ph.D. student at East China Normal University"
  location         : "China"
  employer         :
  email            :          # 填邮箱后显示 Email 图标
  uri              :          # 个人网址
  github           :          # 只需用户名
  googlescholar    : "https://scholar.google.com.hk/citations?user=hbWYZ4MAAAAJ&hl=zh-CN"
  researchgate    :
  twitter          :
  linkedin         :
  dblp             : "https://dblp.org/pid/85/20.html"
  orcid            : "https://orcid.org/0000-0001-8617-4121"


# Reading Files
include:
  - _pages
exclude:
  - docs
  - google_scholar_crawler
  - .github
  - .gitignore
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - run_server.sh
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - node_modules
  - tmp
  - vendor
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Defaults
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed


# Outputting
permalink: /:categories/:title/
timezone: Asia/Shanghai


# Plugins（本仓库是单页站点，不需要分页 / RSS / gist）
plugins:
  - jekyll-sitemap          # 生成 sitemap.xml
  - jekyll-redirect-from    # _pages/about.md 中的 redirect_from
