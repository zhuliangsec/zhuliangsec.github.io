<script>
    $(document).ready(function () {
        {% if site.google_scholar_stats_use_cdn %}
        var gsDataBaseUrl = 'https://cdn.jsdelivr.net/gh/{{ site.repository }}@';
        {% else %}
        var gsDataBaseUrl = 'https://raw.githubusercontent.com/{{ site.repository }}/';
        {% endif %}

        // 未配置 GOOGLE_SCHOLAR_ID 时数据文件不存在（404），此时静默跳过，
        // 页面不会显示空的引用数，也不会出现加载失败的徽标。
        $.getJSON(gsDataBaseUrl + 'google-scholar-stats/gs_data.json').done(function (data) {
            var summary = document.getElementById('citation-summary');
            var total = document.getElementById('total_cit');
            if (summary && total && typeof data.citedby !== 'undefined') {
                total.textContent = data.citedby;
                var badge = document.getElementById('citation-badge');
                if (badge) {
                    badge.src = 'https://img.shields.io/endpoint?url=' +
                        encodeURIComponent(summary.getAttribute('data-shields-url'));
                }
                summary.style.display = '';
            }

            // 单篇论文引用数：在论文后添加
            // <span class='show_paper_citations' data='GOOGLE_SCHOLAR_PAPER_ID'></span>
            var citationEles = document.getElementsByClassName('show_paper_citations');
            Array.prototype.forEach.call(citationEles, function (element) {
                var paperId = element.getAttribute('data');
                var pub = data.publications && data.publications[paperId];
                if (pub) {
                    element.innerHTML = '| Citations: ' + pub.num_citations;
                }
            });
        });
    });
</script>
